[package]
name = "panel-app"
description = "hw_panel: the hardware screen (every sensor's number, simple buttons for the actuators), one raylib program that is also its ROS node"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "hw_panel"
path = "src/main.rs"

[features]
# colcon builds with ROS. `--no-default-features` builds a window that only runs --demo,
# on any computer, with no ROS sourced.
default = ["ros"]
ros = ["panel-feed/ros"]

[dependencies]
anyhow = "1"
panel-core = { path = "../panel-core" }
# The news (ROS, the ESP32): shared with the Orin's web page, which has no window.
panel-feed = { path = "../panel-feed", default-features = false }
hud-core = { path = "../hud-core" }
# Only its library: the window's monitor and full screen, shared with the HUD.
hud-app = { path = "../hud-app", default-features = false }
# The LADDER tab: the test ladder's logic, the same crate the Bevy ladder_window uses. It
# lives in aav_dev_window (outside colcon), but has no Bevy and no ROS: serde only.
ladder-core = { path = "../../../aav_dev_window/crates/ladder-core" }
# The same raylib as hud-app: TrueType fonts, and --screenshot.
raylib = { version = "6", features = [
  "SUPPORT_IMAGE_GENERATION",
  "SUPPORT_FILEFORMAT_TTF",
  "SUPPORT_SCREEN_CAPTURE",
] }
