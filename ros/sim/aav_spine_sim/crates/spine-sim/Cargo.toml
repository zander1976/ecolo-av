[package]
name = "spine-sim"
description = "spine_sim: the spine on a laptop, as a ROS node (bench mode)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spine_sim"
path = "src/main.rs"

# A gamepad as the FS-i6X and its receiver, for spine_sim rc:=true (23 Nov).
[[bin]]
name = "rc_pad"
path = "src/rc_pad.rs"

# The virtual car's ESP32: the Rust firmware's logic on the bridge's bytes (web screens step 4).
[[bin]]
name = "virtual_esp32"
path = "src/virtual_esp32.rs"

[dependencies]
anyhow = "1"
bench-car = { path = "../bench-car" }
virtual-esp32 = { path = "../virtual-esp32" }
# SIGINT, plus SIGTERM and SIGHUP: rclrs 0.8 has no signal handling of its own yet.
ctrlc = { version = "3", features = ["termination"] }
rclrs = "0.8"
# The message types: compiled from the Rust code that ships with Jazzy (AMENT_PREFIX_PATH).
ros-env = "0.3"
